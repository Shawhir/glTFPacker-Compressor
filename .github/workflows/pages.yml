name: Deploy viewer to GitHub Pages

on:
  push:
    branches: [main, claude/upbeat-knuth-whvu6c]
    paths: ['*.html', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}glb_viewer.html
    steps:
      - uses: actions/checkout@v4
      - name: Collect site
        run: |
          mkdir _site
          cp *.html _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
