<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLB Viewer</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --text:#1d2330; --muted:#677084; --line:#dde1e8;
  --accent:#2f6fde; --ok:#1f8a4c; --warn:#b26b00; --bad:#c23b3b;
  --c-json:#8a63d2; --c-geo:#2f6fde; --c-idx:#5fa8e8; --c-tex:#e08a2e; --c-other:#9aa3b2; --c-hdr:#c9ced8;
  --view:#e9ebef;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#14171c; --panel:#1b1f26; --text:#e4e7ec; --muted:#8d95a5; --line:#2b313b;
  --accent:#6a9cf5; --ok:#4cc27e; --warn:#e3a33b; --bad:#ef6b6b; --c-hdr:#3a414d; --view:#20242c;
}}
:root[data-theme="dark"]{
  --bg:#14171c; --panel:#1b1f26; --text:#e4e7ec; --muted:#8d95a5; --line:#2b313b;
  --accent:#6a9cf5; --ok:#4cc27e; --warn:#e3a33b; --bad:#ef6b6b; --c-hdr:#3a414d; --view:#20242c;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
  display:grid;grid-template-columns:360px 1fr;height:100vh;overflow:hidden}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
header h1{font-size:15px;margin:0;flex:1}
button,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
#files{max-height:22vh;overflow:auto;border-bottom:1px solid var(--line)}
#files div{padding:5px 16px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#files div:hover{background:var(--bg)}
#files div.sel{background:var(--accent);color:#fff}
#files .hint{color:var(--muted);cursor:default}
nav{display:flex;border-bottom:1px solid var(--line)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:8px 0;color:var(--muted);border-bottom:2px solid transparent}
nav button.on{color:var(--text);border-bottom-color:var(--accent)}
#info{flex:1;overflow:auto;padding:12px 16px}
#info h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:14px 0 6px}
#info h3:first-child{margin-top:0}
table{border-collapse:collapse;width:100%;font-size:12px}
td,th{text-align:left;padding:3px 4px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:0 6px;border-radius:9px;font-size:11px;border:1px solid var(--line)}
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)} .muted{color:var(--muted)}
.bar{display:flex;height:16px;border-radius:4px;overflow:hidden;margin:6px 0}
.bar span{display:block;height:100%}
.legend{display:grid;grid-template-columns:12px 1fr auto;gap:2px 6px;align-items:center;font-size:12px}
.legend i{width:10px;height:10px;border-radius:2px;display:block}
pre{font:11px/1.4 ui-monospace,Consolas,monospace;background:var(--bg);padding:8px;border-radius:6px;overflow:auto;max-height:50vh;white-space:pre-wrap;word-break:break-all}
main{position:relative;background:var(--view);min-width:0}
#drop{position:absolute;z-index:1;inset:16px;border:2px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;
  text-align:center;color:var(--muted);pointer-events:none;font-size:14px}
#drop.hide{display:none}
body.dragging #drop{display:flex;border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--view) 85%,var(--accent))}
#hud{position:absolute;z-index:2;left:12px;top:12px;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px;font-variant-numeric:tabular-nums;min-width:220px;display:none}
#hud .big{font-size:15px;font-weight:600}
#ctrl{position:absolute;z-index:2;left:12px;right:12px;bottom:12px;display:none;gap:8px;flex-wrap:wrap;align-items:center;
  background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
#ctrl label{display:flex;gap:4px;align-items:center}
#ladder{display:flex;gap:4px;flex-wrap:wrap}
#ladder span{padding:2px 8px;border-radius:9px;border:1px solid var(--line);font-size:12px}
#ladder span.on{background:var(--accent);border-color:var(--accent);color:#fff}
#view{position:absolute;inset:0}
#view canvas{display:block;width:100%;height:100%;outline:none}
#engines{position:absolute;right:12px;top:12px;display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);z-index:2}
#engines button{border:0;border-radius:0;background:none;padding:5px 12px}
#engines button.on{background:var(--accent);color:#fff}
#busy{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--muted);pointer-events:none}
#err{position:absolute;right:12px;top:52px;z-index:2;max-width:50%;background:var(--panel);border:1px solid var(--bad);color:var(--bad);border-radius:8px;padding:8px 10px;display:none}
@media (max-width:760px){
  body{grid-template-columns:1fr;grid-template-rows:55vh 1fr;overflow:auto;height:auto;min-height:100vh}
  main{grid-row:1;min-height:55vh} aside{grid-row:2;border-right:0}
  #info{padding:12px 16px}
}
</style>
<script>
// Import map built here so the ArcGIS Calcite UI modules (unused: the view runs without widgets)
// can all be stubbed; @arcgis/core imports them by bare specifier, which a plain CDN can't resolve.
(() => {
  const NPM = 'https://cdn.jsdelivr.net/npm/', STUB = 'data:text/javascript,';
  const imports = {
    'three': NPM + 'three@0.160.0/build/three.module.js',
    'three/addons/': NPM + 'three@0.160.0/examples/jsm/',
    'luxon': NPM + 'luxon@3.5.0/src/luxon.js',
    '@esri/arcgis-html-sanitizer': NPM + '@esri/arcgis-html-sanitizer@4.1.0/dist/esm/index.js',
    '@zip.js/zip.js': NPM + '@zip.js/zip.js@2.7.57/index.js',
    '@esri/calcite-components/dist/components': STUB + 'export const assetPathChanged=true;export function setAssetPath(){}',
  };
  for (const n of 'accordion accordion-item action action-bar action-group action-menu action-pad alert autocomplete autocomplete-item autocomplete-item-group block block-section button carousel carousel-item checkbox chip chip-group color-picker color-picker-swatch combobox combobox-item combobox-item-group dialog dropdown dropdown-group dropdown-item fab flow flow-item icon input input-date-picker input-message input-number input-time-picker input-time-zone label link list list-item list-item-group loader notice option pagination panel popover progress radio-button radio-button-group scrim select sheet shell slider split-button switch tab tab-nav tab-title table table-cell table-header table-row tabs text-area tile tooltip tree tree-item'.split(' ')) imports['@esri/calcite-components/dist/components/calcite-' + n] = STUB;
  document.currentScript.after(Object.assign(document.createElement('script'), { type: 'importmap', textContent: JSON.stringify({ imports }) }));
})();
</script>
</head>
<body>
<aside>
  <header>
    <h1>GLB Viewer</h1>
    <button id="open" class="primary">Open…</button>
    <button id="theme" title="Toggle theme">◐</button>
    <input id="pick" type="file" multiple accept=".glb,.gltf,.bin,.png,.jpg,.jpeg,.ktx2,.webp" hidden>
  </header>
  <div id="files"><div class="hint">Drop .glb files, or a .gltf with its .bin and textures.</div></div>
  <nav>
    <button data-tab="structure" class="on">Structure</button>
    <button data-tab="lod">LOD</button>
    <button data-tab="materials">Materials</button>
    <button data-tab="meshes">Meshes</button>
    <button data-tab="json">JSON</button>
  </nav>
  <div id="info"><p class="muted">Nothing loaded.</p></div>
</aside>
<main>
  <div id="view"></div>
  <div id="drop">Drop .glb / .gltf (+ .bin, textures) here</div>
  <div id="busy">Loading…</div>
  <div id="engines">
    <button data-engine="three" class="on">three.js</button>
    <button data-engine="babylon">Babylon.js</button>
    <button data-engine="arcgis">ArcGIS JS</button>
  </div>
  <div id="hud"></div>
  <div id="err"></div>
  <div id="ctrl">
    <label>LOD <select id="lodSel"><option value="auto">Auto (ESRI_lod)</option></select></label>
    <div id="ladder"></div>
    <span style="flex:1"></span>
    <label data-cap="row"><input type="checkbox" id="row"> Row ×8</label>
    <label data-cap="wire"><input type="checkbox" id="wire"> Wireframe</label>
    <label data-cap="grid"><input type="checkbox" id="grid" checked> Grid</label>
    <label data-cap="spin"><input type="checkbox" id="spin"> Spin</label>
    <button id="frame">Frame</button>
  </div>
</main>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

const THREE_LIBS = 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/';
const BABYLON_JS = ['https://cdn.jsdelivr.net/npm/babylonjs@7.40.0/babylon.js',
                    'https://cdn.jsdelivr.net/npm/babylonjs-loaders@7.40.0/babylonjs.loaders.min.js'];
const ARCGIS_AMD = 'https://js.arcgis.com/4.32/';                      // Esri's bundled build: fast
const ARCGIS = 'https://cdn.jsdelivr.net/npm/@arcgis/core@4.32.0/';    // unbundled ESM fallback: slow, but allowed everywhere
const SITE = { longitude: 32.8597, latitude: 39.9334 };   // Ankara

// One sun for every engine. ArcGIS takes it as a date over SITE; this date puts the sun at
// azimuth ~259° (WSW), elevation ~50° there, which three.js and Babylon.js reproduce as a direction.
const SUN = { azimuth: 259, elevation: 50, date: '2024-06-21T12:44:00Z' };
const LIGHT = { sky: 0.45, sun: 0.75, skyColor: '#dde6f0', groundColor: '#80806f', sunColor: '#fff4e5' };
const GROUND = [214, 218, 208];
// Direction towards the sun in glTF axes: +Y up, +X east, -Z north.
const SUN_DIR = (() => {
  const a = THREE.MathUtils.degToRad(SUN.azimuth), e = THREE.MathUtils.degToRad(SUN.elevation);
  return new THREE.Vector3(Math.sin(a) * Math.cos(e), Math.sin(e), -Math.cos(a) * Math.cos(e));
})();

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kb = n => n >= 1048576 ? (n/1048576).toFixed(2)+' MB' : n >= 1024 ? (n/1024).toFixed(1)+' KB' : n+' B';
const GLB_MAGIC = 0x46546C67, CHUNK_JSON = 0x4E4F534A, CHUNK_BIN = 0x004E4942;

// ---- theme ---------------------------------------------------------------
try { const t = localStorage.getItem('glbv-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
$('#theme').onclick = () => {
  const dark = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === 'dark'
    : matchMedia('(prefers-color-scheme: dark)').matches;
  const t = dark ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('glbv-theme', t); } catch {}
};

// ---- state -----------------------------------------------------------------
const files = new Map();      // basename -> File/Blob
const urls = new Map();       // basename -> blob URL
let current = null;           // see open()
let engine = null, engineName = 'three';
let tab = 'structure';
const view = $('#view');

// ---- file intake -----------------------------------------------------------
$('#open').onclick = () => $('#pick').click();
$('#pick').onchange = e => addFiles(e.target.files);
addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragging'); });
addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('dragging'); });
addEventListener('drop', async e => {
  e.preventDefault(); document.body.classList.remove('dragging');
  const out = [];
  const walk = async entry => {
    if (entry.isFile) out.push(await new Promise(r => entry.file(r)));
    else if (entry.isDirectory) {
      const rd = entry.createReader();
      for (let batch; (batch = await new Promise(r => rd.readEntries(r))).length;) for (const c of batch) await walk(c);
    }
  };
  const items = [...e.dataTransfer.items].map(i => i.webkitGetAsEntry?.()).filter(Boolean);
  if (items.length) { for (const it of items) await walk(it); addFiles(out); }
  else addFiles(e.dataTransfer.files);
});

function addFiles(list) {
  for (const f of list) {
    if (urls.has(f.name)) URL.revokeObjectURL(urls.get(f.name));
    files.set(f.name, f); urls.set(f.name, URL.createObjectURL(f));
  }
  renderFileList();
  const first = [...files.keys()].find(n => /\.(glb|gltf)$/i.test(n));
  if (first && !current) open(first);
}

function renderFileList() {
  const models = [...files.keys()].filter(n => /\.(glb|gltf)$/i.test(n)).sort();
  $('#files').innerHTML = models.length
    ? models.map(n => `<div data-n="${esc(n)}" class="${current?.name === n ? 'sel' : ''}">${esc(n)}</div>`).join('')
    : '<div class="hint">No .glb / .gltf among the dropped files.</div>';
  $('#files').querySelectorAll('[data-n]').forEach(d => d.onclick = () => open(d.dataset.n));
}

// ---- GLB read / write ------------------------------------------------------
function parseGlb(ab) {
  const dv = new DataView(ab);
  if (ab.byteLength < 12 || dv.getUint32(0, true) !== GLB_MAGIC) return null;
  const version = dv.getUint32(4, true), length = dv.getUint32(8, true);
  const chunks = []; let json = null, bin = new Uint8Array(0), off = 12;
  while (off + 8 <= Math.min(length, ab.byteLength)) {
    const len = dv.getUint32(off, true), type = dv.getUint32(off + 4, true);
    chunks.push({ type, len, offset: off });
    if (type === CHUNK_JSON) json = JSON.parse(new TextDecoder().decode(new Uint8Array(ab, off + 8, len)));
    else if (type === CHUNK_BIN) bin = new Uint8Array(ab, off + 8, len);
    off += 8 + len;
  }
  return { version, length, fileSize: ab.byteLength, chunks, json, bin };
}

function writeGlb(json, bin) {
  const jt = new TextEncoder().encode(JSON.stringify(json));
  const jb = new Uint8Array(jt.length + (4 - jt.length % 4) % 4).fill(0x20); jb.set(jt);
  const bl = bin.byteLength + (4 - bin.byteLength % 4) % 4;
  const total = 12 + 8 + jb.length + (bl ? 8 + bl : 0), out = new Uint8Array(total), dv = new DataView(out.buffer);
  dv.setUint32(0, GLB_MAGIC, true); dv.setUint32(4, 2, true); dv.setUint32(8, total, true);
  dv.setUint32(12, jb.length, true); dv.setUint32(16, CHUNK_JSON, true); out.set(jb, 20);
  if (bl) { const o = 20 + jb.length; dv.setUint32(o, bl, true); dv.setUint32(o + 4, CHUNK_BIN, true); out.set(bin, o + 8); }
  return out;
}

const MIME = { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', ktx2: 'image/ktx2', webp: 'image/webp' };
async function fetchUri(uri) {
  if (uri.startsWith('data:')) return new Uint8Array(await (await fetch(uri)).arrayBuffer());
  const f = files.get(decodeURIComponent(uri.split('/').pop()));
  if (!f) throw new Error('missing ' + uri);
  return new Uint8Array(await f.arrayBuffer());
}

// .gltf + external files -> { json, bin } with everything moved into one buffer.
async function packParts(src) {
  const json = structuredClone(src), parts = []; let len = 0;
  const push = u8 => {
    const pad = (4 - len % 4) % 4; if (pad) { parts.push(new Uint8Array(pad)); len += pad; }
    const off = len; parts.push(u8); len += u8.byteLength; return off;
  };
  const bufOff = [];
  for (const b of json.buffers || []) bufOff.push(push(b.uri ? (await fetchUri(b.uri)).subarray(0, b.byteLength) : new Uint8Array(0)));
  for (const bv of json.bufferViews || []) { bv.byteOffset = (bv.byteOffset || 0) + bufOff[bv.buffer]; bv.buffer = 0; }
  for (const im of json.images || []) {
    if (!im.uri) continue;
    const u8 = await fetchUri(im.uri);
    (json.bufferViews ||= []).push({ buffer: 0, byteOffset: push(u8), byteLength: u8.byteLength });
    im.bufferView = json.bufferViews.length - 1;
    im.mimeType ||= im.uri.startsWith('data:') ? im.uri.slice(5, im.uri.indexOf(';')) : MIME[im.uri.split('.').pop().toLowerCase()];
    delete im.uri;
  }
  const tail = (4 - len % 4) % 4; if (tail) { parts.push(new Uint8Array(tail)); len += tail; }
  if (len) json.buffers = [{ byteLength: len }]; else delete json.buffers;
  const bin = new Uint8Array(len); let o = 0;
  for (const p of parts) { bin.set(p, o); o += p.byteLength; }
  return { json, bin };
}

// ---- MSFT_lod helpers --------------------------------------------------------
function lodChain(json) {
  const top = (json.nodes || []).findIndex(n => n.extensions?.MSFT_lod);
  if (top < 0) return null;
  const n = json.nodes[top];
  return { top, nodes: [top, ...(n.extensions.MSFT_lod.ids || [])], thresholds: n.extras?.ESRI_lod?.thresholds || null };
}

// Where the top LOD node hangs: a parent's children list, or the scene's root list.
function holderOf(json, idx) {
  for (const n of json.nodes) if (n.children?.includes(idx)) return n.children;
  for (const s of json.scenes || []) if (s.nodes?.includes(idx)) return s.nodes;
  return null;
}

function stripLodExt(json, idx) {
  const n = json.nodes[idx];
  delete n.extensions.MSFT_lod;
  if (!Object.keys(n.extensions).length) delete n.extensions;
  if (!json.nodes.some(x => x.extensions?.MSFT_lod)) {
    json.extensionsUsed = (json.extensionsUsed || []).filter(e => e !== 'MSFT_lod');
    if (json.extensionsRequired) json.extensionsRequired = json.extensionsRequired.filter(e => e !== 'MSFT_lod');
  }
}

// Every LOD level becomes a sibling node tagged extras.__lod, so any engine loads them all
// and the viewer decides which one is visible.
function explode(src) {
  const json = structuredClone(src), ch = lodChain(json);
  if (!ch) return json;
  const holder = holderOf(json, ch.top);
  ch.nodes.forEach((ni, i) => {
    const n = json.nodes[ni];
    n.extras = { ...(n.extras || {}), __lod: i };
    if (i && holder && !holder.includes(ni)) holder.push(ni);
  });
  stripLodExt(json, ch.top);
  return json;
}

// Only level k left in the scene, no ESRI_lod: lets ArcGIS show one forced level.
function singleLevel(src, k) {
  const json = structuredClone(src), ch = lodChain(json);
  if (!ch) return json;
  const holder = holderOf(json, ch.top);
  if (holder) holder.splice(holder.indexOf(ch.top), 1, ch.nodes[k]);
  delete json.nodes[ch.top].extras?.ESRI_lod;
  stripLodExt(json, ch.top);
  return json;
}

function levelStats(json, ni, acc = { tris: 0, verts: 0, mats: new Set() }) {
  const n = json.nodes[ni];
  if (n.mesh != null) for (const p of json.meshes[n.mesh].primitives) {
    const v = json.accessors[p.attributes.POSITION]?.count || 0, c = p.indices != null ? json.accessors[p.indices].count : v;
    const mode = p.mode ?? 4;
    acc.verts += v;
    acc.tris += mode === 4 ? c / 3 : (mode === 5 || mode === 6) ? Math.max(0, c - 2) : 0;
    if (p.material != null) acc.mats.add(json.materials?.[p.material]?.name);
  }
  for (const c of n.children || []) levelStats(json, c, acc);
  return acc;
}

// World-space bounds of a node subtree, from accessor min/max and node transforms.
function nodeBounds(json, idx) {
  const parent = {};
  json.nodes.forEach((n, i) => (n.children || []).forEach(c => parent[c] = i));
  const local = n => n.matrix ? new THREE.Matrix4().fromArray(n.matrix)
    : new THREE.Matrix4().compose(new THREE.Vector3(...(n.translation || [0, 0, 0])),
        new THREE.Quaternion(...(n.rotation || [0, 0, 0, 1])), new THREE.Vector3(...(n.scale || [1, 1, 1])));
  const m = new THREE.Matrix4();
  for (let p = parent[idx]; p != null; p = parent[p]) m.premultiply(local(json.nodes[p]));
  const box = new THREE.Box3();
  const visit = (i, M) => {
    const n = json.nodes[i], W = M.clone().multiply(local(n));
    if (n.mesh != null) for (const p of json.meshes[n.mesh].primitives) {
      const a = json.accessors[p.attributes.POSITION];
      if (a?.min && a?.max) box.union(new THREE.Box3(new THREE.Vector3(...a.min), new THREE.Vector3(...a.max)).applyMatrix4(W));
    }
    (n.children || []).forEach(c => visit(c, W));
  };
  visit(idx, m);
  return box;
}

// What each bufferView holds: textures, index data, vertex attributes, or other.
function classifyViews(json) {
  const kind = {};
  (json.images || []).forEach(im => { if (im.bufferView != null) kind[im.bufferView] = 'tex'; });
  for (const m of json.meshes || []) for (const p of m.primitives || []) {
    const acc = i => json.accessors?.[i]?.bufferView;
    if (p.indices != null && acc(p.indices) != null) kind[acc(p.indices)] ??= 'idx';
    for (const a of Object.values(p.attributes || {})) if (acc(a) != null) kind[acc(a)] ??= 'geo';
    const dr = p.extensions?.KHR_draco_mesh_compression; if (dr) kind[dr.bufferView] = 'geo';
  }
  (json.accessors || []).forEach(a => { if (a.bufferView != null) kind[a.bufferView] ??= 'other'; });
  return kind;
}

async function readInfo(name) {
  const f = files.get(name), ab = await f.arrayBuffer();
  if (/\.glb$/i.test(name)) {
    const glb = parseGlb(ab);
    if (!glb) throw new Error(`${name} is not a binary glTF (bad magic)`);
    const kind = classifyViews(glb.json), parts = { hdr: 12 + 8 * glb.chunks.length, json: 0, geo: 0, idx: 0, tex: 0, other: 0 };
    for (const c of glb.chunks) if (c.type === CHUNK_JSON) parts.json += c.len;
    let used = 0;
    (glb.json.bufferViews || []).forEach((bv, i) => { parts[kind[i] || 'other'] += bv.byteLength; used += bv.byteLength; });
    parts.other += Math.max(0, glb.bin.byteLength - used);   // alignment padding / orphaned bytes
    return { kind: 'glb', json: glb.json, bin: glb.bin, glb, parts, size: ab.byteLength };
  }
  const json = JSON.parse(new TextDecoder().decode(ab));
  const ext = [], missing = [];
  const sizeOf = uri => {
    if (uri.startsWith('data:')) return Math.floor((uri.length - uri.indexOf(',') - 1) * 3 / 4);
    const f = files.get(decodeURIComponent(uri.split('/').pop()));
    if (!f) { missing.push(uri); return 0; } return f.size;
  };
  (json.buffers || []).forEach(b => b.uri && ext.push({ uri: b.uri, kind: 'buffer', size: sizeOf(b.uri) }));
  (json.images || []).forEach(im => im.uri && ext.push({ uri: im.uri, kind: 'image', size: sizeOf(im.uri) }));
  const kind = classifyViews(json), parts = { hdr: 0, json: ab.byteLength, geo: 0, idx: 0, tex: 0, other: 0 };
  (json.bufferViews || []).forEach((bv, i) => parts[kind[i] || 'other'] += bv.byteLength);
  ext.filter(e => e.kind === 'image').forEach(e => parts.tex += e.size);
  return { kind: 'gltf', json, ext, missing, parts, size: ab.byteLength + ext.reduce((s, e) => s + e.size, 0) };
}

// ---- open --------------------------------------------------------------------
async function open(name) {
  showErr('');
  try {
    const info = await readInfo(name);
    const { json, bin } = info.kind === 'glb' ? info : await packParts(info.json);
    if (current) for (const u of current.blobs) URL.revokeObjectURL(u);
    const blobs = [];
    const blobUrl = bytes => { const u = URL.createObjectURL(new Blob([bytes], { type: 'model/gltf-binary' })); blobs.push(u); return u; };
    const ch = lodChain(json);
    const box = nodeBounds(json, ch ? ch.top : (json.scenes?.[json.scene || 0]?.nodes?.[0] ?? 0));
    const singles = {};
    current = {
      name, info, json, chain: ch, blobs,
      thresholds: ch?.thresholds || null,
      levels: ch ? ch.nodes.map(ni => ({ node: ni, name: json.nodes[ni].name || 'node ' + ni, ...levelStats(json, ni) })) : [],
      box, height: box.max.y - box.min.y, radius: box.getBoundingSphere(new THREE.Sphere()).radius || 1,
      origUrl: info.kind === 'glb' ? urls.get(name) : blobUrl(writeGlb(json, bin)),
      explodedUrl: blobUrl(writeGlb(explode(json), bin)),
      singleUrl: k => singles[k] ||= blobUrl(writeGlb(singleLevel(json, k), bin)),
    };
    setupControls(); renderFileList(); renderInfo();
    $('#drop').classList.add('hide');
    await loadIntoEngine();
  } catch (e) { console.error(e); showErr(`${name}: ${e.message || e}`); }
}

async function loadIntoEngine() {
  if (!engine || !current) return;
  $('#busy').style.display = 'flex';
  try { await engine.load(current); engine.frame(); applyToggles(); }
  catch (e) { console.error(e); showErr(`${engine.label}: ${e.message || e}`); }
  finally { $('#busy').style.display = 'none'; }
}

// ---- engines -----------------------------------------------------------------
// Each engine: { label, caps, load(cur), frame(), setLevel(i), screenPx(), toggle(name, on), setForced?(mode), dispose() }

function threeEngine(box) {
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  box.append(renderer.domElement);
  const scene = new THREE.Scene();
  // three's Lambert divides every light by π, hence the π on both.
  scene.add(new THREE.HemisphereLight(LIGHT.skyColor, LIGHT.groundColor, LIGHT.sky * Math.PI));
  const sun = new THREE.DirectionalLight(LIGHT.sunColor, LIGHT.sun * Math.PI);
  sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
  scene.add(sun, sun.target);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2),
    new THREE.MeshStandardMaterial({ color: new THREE.Color(...GROUND.map(v => v / 255)), roughness: 1 }));
  ground.receiveShadow = true;
  scene.add(ground);
  const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 10000);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  const grid = new THREE.GridHelper(20, 20, 0x888888, 0x888888);
  grid.material.opacity = 0.25; grid.material.transparent = true;
  scene.add(grid);
  const loader = new GLTFLoader()
    .setDRACOLoader(new DRACOLoader().setDecoderPath(THREE_LIBS + 'draco/gltf/'))
    .setKTX2Loader(new KTX2Loader().setTranscoderPath(THREE_LIBS + 'basis/').detectSupport(renderer))
    .setMeshoptDecoder(MeshoptDecoder);
  const resize = () => {
    const w = box.clientWidth, h = box.clientHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  };
  const ro = new ResizeObserver(resize); ro.observe(box); resize();
  renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });

  let root = null, levels = [], sphere = new THREE.Sphere(), wire = false;
  const clear = () => {
    if (!root) return;
    scene.remove(root);
    root.traverse(o => {
      o.geometry?.dispose();
      for (const m of [].concat(o.material || [])) { for (const v of Object.values(m)) v?.isTexture && v.dispose(); m.dispose(); }
    });
  };
  return {
    label: 'three.js', caps: { wire: 1, grid: 1, spin: 1, hud: 1 },
    async load(cur) {
      const gltf = await loader.loadAsync(cur.explodedUrl);
      clear(); root = gltf.scene; scene.add(root);
      levels = [];
      root.traverse(o => {
        if (o.userData?.__lod != null) levels[o.userData.__lod] = o;
        if (o.isMesh) o.castShadow = o.receiveShadow = true;
      });
      const b = new THREE.Box3().setFromObject(levels[0] || root), r = (sphere = b.getBoundingSphere(new THREE.Sphere())).radius;
      ground.position.y = b.min.y; ground.scale.setScalar(r * 60);
      grid.position.y = b.min.y + r * 0.002; grid.scale.setScalar(Math.max(r / 5, 0.1));
      sun.position.copy(sphere.center).addScaledVector(SUN_DIR, r * 4); sun.target.position.copy(sphere.center);
      Object.assign(sun.shadow.camera, { left: -r * 2.5, right: r * 2.5, top: r * 2.5, bottom: -r * 2.5, near: r * 0.5, far: r * 8 });
      sun.shadow.camera.updateProjectionMatrix();
      sun.shadow.bias = -0.0005; sun.shadow.normalBias = r * 0.01;
    },
    frame() {
      const { center, radius } = sphere;
      const d = radius / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.1;
      camera.position.copy(center).add(new THREE.Vector3(0.6, 0.35, 1).normalize().multiplyScalar(d));
      camera.near = Math.max(radius / 1000, 0.001); camera.far = d * 100; camera.updateProjectionMatrix();
      controls.target.copy(center); controls.update();
    },
    setLevel(a) { levels.forEach((o, i) => o.visible = i === a); },
    // Same metric ArcGIS uses for ESRI_lod: bounding-sphere radius projected to pixels.
    screenPx() {
      const d = Math.max(camera.position.distanceTo(sphere.center), 1e-6);
      return sphere.radius / (d * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))) * (box.clientHeight / 2);
    },
    toggle(k, on) {
      if (k === 'grid') grid.visible = on;
      if (k === 'spin') controls.autoRotate = on;
      if (k === 'wire') root?.traverse(o => o.isMesh && [].concat(o.material).forEach(m => m.wireframe = on));
    },
    dispose() { renderer.setAnimationLoop(null); ro.disconnect(); controls.dispose(); clear(); renderer.dispose(); renderer.domElement.remove(); },
  };
}

const loadScript = src => new Promise((res, rej) => {
  if (document.querySelector(`script[src="${src}"]`)) return res();
  const s = Object.assign(document.createElement('script'), { src, onload: res, onerror: () => rej(new Error('could not load ' + src)) });
  document.head.append(s);
});

async function babylonEngine(box) {
  // Hide an AMD loader (ArcGIS's) while the UMD bundles load, or they register as AMD modules instead of window.BABYLON.
  const amd = window.define; window.define = undefined;
  try { for (const src of BABYLON_JS) await loadScript(src); } finally { if (amd) window.define = amd; }
  const B = window.BABYLON;
  const canvas = document.createElement('canvas'); box.append(canvas);
  const eng = new B.Engine(canvas, true, { stencil: true }, true);
  const scene = new B.Scene(eng);
  scene.clearColor = new B.Color4(0, 0, 0, 0);
  // Same viewpoint as three.js: from the south-east, ~17° up. glTF (x, y, z) lands in Babylon as (-x, y, z).
  const VIEW_ALPHA = Math.PI / 2 + Math.atan(0.6), VIEW_BETA = Math.PI / 2 - Math.asin(0.35 / Math.hypot(0.6, 0.35, 1));
  const cam = new B.ArcRotateCamera('cam', VIEW_ALPHA, VIEW_BETA, 10, B.Vector3.Zero(), scene);
  cam.attachControl(canvas, true); cam.wheelDeltaPercentage = 0.01; cam.minZ = 0.01; cam.fov = THREE.MathUtils.degToRad(45);
  const sky = new B.HemisphericLight('sky', new B.Vector3(0, 1, 0), scene);
  sky.intensity = LIGHT.sky; sky.diffuse = B.Color3.FromHexString(LIGHT.skyColor); sky.groundColor = B.Color3.FromHexString(LIGHT.groundColor);
  sky.specular = B.Color3.Black();
  const toSun = new B.Vector3(-SUN_DIR.x, SUN_DIR.y, SUN_DIR.z);
  const sun = new B.DirectionalLight('sun', toSun.scale(-1), scene);
  sun.intensity = LIGHT.sun * Math.PI;   // Babylon PBR divides punctual lights by π (hemispheric light: no), matching three's
  sun.diffuse = B.Color3.FromHexString(LIGHT.sunColor);
  const shadows = new B.ShadowGenerator(2048, sun);
  shadows.usePoissonSampling = true;   // PCF rendered no shadow on some WebGL2 drivers; Poisson works everywhere
  shadows.bias = 0.001; shadows.normalBias = 0.01;
  const ground = B.MeshBuilder.CreateGround('ground', { width: 1, height: 1 }, scene);
  const gm = new B.PBRMaterial('groundMat', scene);   // PBR like the glTF materials, so it lights the same as in three.js
  gm.albedoColor = B.Color3.FromInts(...GROUND).toLinearSpace(); gm.metallic = 0; gm.roughness = 1;
  ground.material = gm; ground.receiveShadows = true;
  const ro = new ResizeObserver(() => eng.resize()); ro.observe(box);
  eng.runRenderLoop(() => scene.render());

  let container = null, levels = [], center = B.Vector3.Zero(), radius = 1;
  return {
    label: 'Babylon.js', caps: { wire: 1, spin: 1, hud: 1 },
    async load(cur) {
      const res = await B.SceneLoader.LoadAssetContainerAsync('', cur.explodedUrl, scene, null, '.glb');
      container?.dispose(); container = res; res.addAllToScene();
      levels = [];
      for (const n of [...res.transformNodes, ...res.meshes]) {
        const l = n.metadata?.gltf?.extras?.__lod;
        if (l != null) levels[l] = n;
      }
      const top = levels[0] || res.meshes[0];
      const { min, max } = top.getHierarchyBoundingVectors(true);
      center = min.add(max).scale(0.5); radius = Math.max(max.subtract(min).length() / 2, 1e-3);
      const casters = res.meshes.filter(m => m.getTotalVertices() > 0);
      casters.forEach(m => m.receiveShadows = true);
      shadows.getShadowMap().renderList = casters;
      ground.position.y = min.y; ground.scaling.setAll(radius * 60);
      // depth range must reach the ground, not just the casters (auto bounds stop at the model)
      sun.position = center.add(toSun.scale(radius * 4)); sun.shadowMinZ = radius * 0.5; sun.shadowMaxZ = radius * 8;
    },
    frame() {
      cam.setTarget(center.clone());   // recomputes alpha/beta from the old position, so set them after
      cam.alpha = VIEW_ALPHA; cam.beta = VIEW_BETA;
      cam.radius = radius / Math.sin(cam.fov / 2) * 1.1;
      cam.minZ = radius / 1000; cam.maxZ = cam.radius * 100;
    },
    setLevel(a) { levels.forEach((n, i) => n.setEnabled(i === a)); },
    screenPx() {
      const d = Math.max(B.Vector3.Distance(cam.position, center), 1e-6);
      return radius / (d * Math.tan(cam.fov / 2)) * (canvas.clientHeight / 2);
    },
    toggle(k, on) {
      if (k === 'wire') scene.forceWireframe = on;
      if (k === 'spin') cam.useAutoRotationBehavior = on;
    },
    dispose() { ro.disconnect(); eng.stopRenderLoop(); scene.dispose(); eng.dispose(); canvas.remove(); },
  };
}

// The ArcGIS widget theme, inlined so the page needs no external stylesheet.
async function arcgisCss(base) {
  if (document.getElementById('arcgis-css')) return;
  try {
    const css = (await (await fetch(base + 'main.css')).text())
      .replace(/url\((['"]?)(?!data:|https?:|blob:)/g, `url($1${base}`);
    document.head.append(Object.assign(document.createElement('style'), { id: 'arcgis-css', textContent: css }));
  } catch (e) { console.warn('ArcGIS CSS not loaded', e); }
}

const ARCGIS_MODULES = ['config', 'Map', 'views/SceneView', 'Graphic', 'layers/GraphicsLayer'];
let arcgisSdk = null;
// Esri's bundled AMD build loads in a few requests. Where js.arcgis.com is blocked, fall back to
// @arcgis/core from jsDelivr, which works anywhere but fetches thousands of separate modules.
function loadArcgis() {
  return arcgisSdk ||= (async () => {
    try {
      await loadScript(ARCGIS_AMD);
      const mods = await new Promise((res, rej) => {
        const t = setTimeout(() => rej(new Error('timeout')), 30000);
        window.require(ARCGIS_MODULES.map(m => 'esri/' + m), (...m) => { clearTimeout(t); res(m); });
      });
      await arcgisCss(ARCGIS_AMD + 'esri/themes/light/');
      return mods;
    } catch (e) {
      console.warn('js.arcgis.com unavailable, using jsDelivr @arcgis/core', e);
      const mods = (await Promise.all(ARCGIS_MODULES.map(p => import(ARCGIS + p + '.js')))).map(m => m.default);
      mods[0].assetsPath = ARCGIS + 'assets';
      await arcgisCss(ARCGIS + 'assets/esri/themes/light/');
      return mods;
    }
  })().catch(e => { arcgisSdk = null; throw e; });
}

async function arcgisEngine(box) {
  const [, EsriMap, SceneView, Graphic, GraphicsLayer] = await loadArcgis();
  const div = Object.assign(document.createElement('div'), { style: 'position:absolute;inset:0' });
  box.append(div);
  const layer = new GraphicsLayer({ elevationInfo: { mode: 'relative-to-ground' } });
  const map = new EsriMap({ layers: [layer] });
  map.ground.surfaceColor = GROUND;
  const sv = new SceneView({
    container: div, map, qualityProfile: 'high',
    environment: {
      background: { type: 'color', color: [233, 235, 239, 1] }, starsEnabled: false, atmosphereEnabled: false,
      // cameraTrackingEnabled would re-time the sun to the camera's longitude, moving it off SUN
      lighting: { type: 'sun', date: new Date(SUN.date), directShadowsEnabled: true, cameraTrackingEnabled: false },
    },
    ui: { components: [] },   // no widgets: they would pull in Calcite, which the jsDelivr path can't resolve
  });
  await sv.when();

  let cur = null, forced = 'auto', row = false;
  const mPerDegLat = 111320, mPerDegLon = 111320 * Math.cos(SITE.latitude * Math.PI / 180);
  const build = () => {
    layer.removeAll();
    if (!cur) return;
    const href = forced === 'auto' ? cur.origUrl : cur.singleUrl(+forced);
    const n = row ? 8 : 1;
    for (let i = 0; i < n; i++) {
      // each tree further out (so the row spans the LOD ladder) and stepped sideways so none hides another
      const north = i ? cur.radius * 4 * Math.pow(1.8, i) : 0, east = i * cur.radius * 2.5;
      layer.add(new Graphic({
        geometry: { type: 'point', longitude: SITE.longitude + east / mPerDegLon, latitude: SITE.latitude + north / mPerDegLat, z: 0 },
        symbol: { type: 'point-3d', symbolLayers: [{ type: 'object', resource: { href }, anchor: 'bottom' }] },
      }));
    }
  };
  return {
    label: 'ArcGIS JS', caps: { row: 1, hud: 1, native: 1 },
    async load(c) { cur = c; build(); await sv.whenLayerView(layer); },
    frame() {
      const first = layer.graphics.getItemAt(0);
      sv.environment.lighting.date = new Date(SUN.date);
      if (first) sv.goTo({ target: first, heading: 329, tilt: 73 }, { animate: false }).catch(() => {});   // same south-east viewpoint as the others
    },
    setForced(m) { if (m !== forced) { forced = m; build(); } },
    toggle(k, on) { if (k === 'row') { row = on; build(); this.frame(); } },
    setLevel() {},
    // Estimate only: ArcGIS picks the level itself; this predicts it with the same formula.
    screenPx() {
      if (!cur || !sv.camera) return 0;
      const p = sv.camera.position, cz = cur.height / 2;
      const dx = (p.longitude - SITE.longitude) * mPerDegLon, dy = (p.latitude - SITE.latitude) * mPerDegLat, dz = p.z - cz;
      const d = Math.max(Math.hypot(dx, dy, dz), 1e-6), w = div.clientWidth, h = div.clientHeight;
      const tanV = Math.tan(THREE.MathUtils.degToRad(sv.camera.fov / 2)) * h / Math.hypot(w, h);   // camera.fov is diagonal
      return cur.radius / (d * tanV) * (h / 2);
    },
    dispose() { sv.destroy(); div.remove(); },
  };
}

const ENGINES = { three: threeEngine, babylon: babylonEngine, arcgis: arcgisEngine };
async function useEngine(name) {
  showErr('');
  engineName = name;
  document.querySelectorAll('#engines button').forEach(b => b.classList.toggle('on', b.dataset.engine === name));
  try { engine?.dispose(); } catch (e) { console.warn(e); }
  engine = null; view.innerHTML = '';
  $('#busy').textContent = name === 'arcgis' ? 'Loading ArcGIS Maps SDK…' : 'Loading…';
  $('#busy').style.display = 'flex';
  try { engine = await ENGINES[name](view); }
  catch (e) { console.error(e); showErr(`Could not start ${name}: ${e.message || e}`); $('#hud').style.display = 'none'; }
  finally { $('#busy').style.display = 'none'; }
  setupControls();
  await loadIntoEngine();
}
document.querySelectorAll('#engines button').forEach(b => b.onclick = () => b.dataset.engine !== engineName && useEngine(b.dataset.engine));
$('#engines [data-engine=arcgis]').addEventListener('pointerenter', () => loadArcgis().catch(() => {}), { once: true });

// ---- controls + HUD ------------------------------------------------------------
function setupControls() {
  const caps = engine?.caps || {};
  document.querySelectorAll('#ctrl [data-cap]').forEach(l => l.style.display = caps[l.dataset.cap] ? '' : 'none');
  if (!current) return;
  const { levels, thresholds } = current, sel = $('#lodSel'), keep = sel.value;
  const autoLbl = caps.native ? 'Auto (ArcGIS native)' : thresholds ? 'Auto (ESRI_lod)' : 'Auto (no ESRI_lod → top only)';
  sel.innerHTML = (levels.length ? `<option value="auto">${autoLbl}</option>` : '<option value="auto">No MSFT_lod</option>')
    + levels.map((l, i) => `<option value="${i}">Level ${i}: ${esc(l.name)}</option>`).join('');
  sel.value = [...sel.options].some(o => o.value === keep) ? keep : 'auto';
  $('#ladder').innerHTML = levels.map((l, i) => `<span data-i="${i}">${i}${thresholds ? ' ≥' + thresholds[i] + 'px' : ''}</span>`).join('');
  $('#ctrl').style.display = 'flex'; $('#hud').style.display = 'block';
}
function applyToggles() {
  for (const k of ['wire', 'grid', 'spin', 'row']) if (engine?.caps[k]) engine.toggle(k, $('#' + k).checked);
  engine?.setForced?.($('#lodSel').value);
}
for (const k of ['wire', 'grid', 'spin', 'row']) $('#' + k).onchange = e => engine?.toggle(k, e.target.checked);
$('#lodSel').onchange = e => engine?.setForced?.(e.target.value);
$('#frame').onclick = () => engine?.frame();

function pickLevel(px) {
  const { levels, thresholds } = current, mode = $('#lodSel').value;
  if (!levels.length) return [0, 'single level'];
  if (mode !== 'auto') return [+mode, 'forced'];
  if (!thresholds) return [0, 'no ESRI_lod: ArcGIS shows the top level only'];
  const a = thresholds.findIndex(t => px >= t);
  return [a, a < 0 ? `culled (< ${thresholds[thresholds.length - 1]}px)` : `radius ≥ ${thresholds[a]}px`];
}

function tick() {
  requestAnimationFrame(tick);
  if (!engine || !current) return;
  const px = engine.screenPx(), [active, why] = pickLevel(px), native = engine.caps.native;
  engine.setLevel(active);
  $('#ladder').querySelectorAll('span').forEach(s => s.classList.toggle('on', +s.dataset.i === active));
  const lv = current.levels[active];
  $('#hud').innerHTML = `<div class="big">${current.levels.length ? (active < 0 ? 'Culled' : 'Level ' + active) : 'Model'}${native && $('#lodSel').value === 'auto' ? ' <span class="muted">(predicted)</span>' : ''}</div>
    <div class="muted">${esc(engine.label)} · ${esc(why)}</div>
    <div>Screen radius: <b>${native ? '≈' : ''}${px.toFixed(1)} px</b></div>
    ${lv ? `<div>${lv.tris.toLocaleString()} tris · ${lv.verts.toLocaleString()} verts</div>` : ''}`;
}
requestAnimationFrame(tick);

function showErr(m) { $('#err').style.display = m ? 'block' : 'none'; $('#err').textContent = m; }

// ---- info panel --------------------------------------------------------------
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  renderInfo();
});

const PARTS = [['hdr', 'GLB header + chunk headers', '--c-hdr'], ['json', 'JSON', '--c-json'], ['geo', 'Vertex attributes', '--c-geo'],
               ['idx', 'Indices', '--c-idx'], ['tex', 'Textures', '--c-tex'], ['other', 'Other / padding', '--c-other']];

function renderInfo() {
  if (!current) return;
  const { info, json } = current, el = $('#info');
  const T = {
    structure() {
      const p = info.parts, total = Object.values(p).reduce((a, b) => a + b, 0) || 1;
      let h = `<h3>${info.kind === 'glb' ? 'Binary glTF (.glb)' : 'JSON glTF (.gltf) + external files'}</h3>`;
      h += `<div class="bar">${PARTS.filter(([k]) => p[k]).map(([k, , c]) => `<span style="width:${p[k] / total * 100}%;background:var(${c})"></span>`).join('')}</div>`;
      h += `<div class="legend">${PARTS.filter(([k]) => p[k]).map(([k, l, c]) => `<i style="background:var(${c})"></i><span>${l}</span><span class="n">${kb(p[k])}</span>`).join('')}</div>`;
      if (info.kind === 'glb') {
        const g = info.glb;
        h += `<h3>Layout</h3><table>
          <tr><th>Offset</th><th>Block</th><th class="n">Bytes</th></tr>
          <tr><td>0</td><td>Header: magic "glTF", version ${g.version}, length ${g.length.toLocaleString()}</td><td class="n">12</td></tr>
          ${g.chunks.map(c => `<tr><td>${c.offset}</td><td>${c.type === CHUNK_JSON ? 'JSON chunk' : c.type === CHUNK_BIN ? 'BIN chunk' : 'Unknown chunk 0x' + c.type.toString(16)}</td><td class="n">${(8 + c.len).toLocaleString()}</td></tr>`).join('')}
        </table>`;
        if (g.length !== g.fileSize) h += `<p class="bad">Header length ${g.length} ≠ file size ${g.fileSize}</p>`;
        h += `<p class="muted">A GLB is one file: a 12-byte header, then a JSON chunk (the scene description) and a BIN chunk. Meshes and embedded images point into the BIN chunk through bufferViews instead of separate files.</p>`;
      } else {
        h += `<h3>External files</h3><table><tr><th>URI</th><th>Kind</th><th class="n">Size</th></tr>
          ${info.ext.map(e => `<tr><td>${esc(e.uri.startsWith('data:') ? 'data: URI' : e.uri)}</td><td>${e.kind}</td><td class="n ${info.missing.includes(e.uri) ? 'bad' : ''}">${info.missing.includes(e.uri) ? 'missing' : kb(e.size)}</td></tr>`).join('')}</table>`;
        h += `<p class="muted">Packing to GLB moves every buffer and image into one BIN chunk, rewrites their URIs to bufferViews, and keeps the JSON (extensions, extras, MSFT_lod) as-is.</p>
          <button class="primary" id="pack" ${info.missing.length ? 'disabled' : ''}>Pack to GLB and view</button>`;
      }
      h += `<h3>Buffer views</h3><table><tr><th>#</th><th>Holds</th><th class="n">Offset</th><th class="n">Bytes</th></tr>`;
      const kind = classifyViews(info.json), lbl = { tex: 'texture', idx: 'indices', geo: 'vertices', other: 'other' };
      (info.json.bufferViews || []).forEach((bv, i) => h += `<tr><td>${i}</td><td>${lbl[kind[i]] || 'unused'}${bv.byteStride ? ' · stride ' + bv.byteStride : ''}</td><td class="n">${(bv.byteOffset || 0).toLocaleString()}</td><td class="n">${bv.byteLength.toLocaleString()}</td></tr>`);
      h += `</table><h3>Extensions</h3><p>${(json.extensionsUsed || []).map(e => `<span class="tag">${esc(e)}</span>`).join(' ') || '<span class="muted">none</span>'}</p>`;
      if (json.asset?.extras) h += `<h3>asset.extras</h3><pre>${esc(JSON.stringify(json.asset.extras, null, 1))}</pre>`;
      return h;
    },
    lod() {
      const { levels, thresholds, chain } = current;
      if (!chain) return '<p class="muted">No node carries MSFT_lod, so this file is a single level.</p>';
      let h = `<h3>MSFT_lod chain on node ${chain.top} (${esc(json.nodes[chain.top].name)})</h3>
        <table><tr><th>Lvl</th><th>Node</th><th class="n">ESRI ≥px</th><th class="n">Tris</th><th class="n">Verts</th></tr>
        ${levels.map((l, i) => `<tr><td>${i}</td><td>${esc(l.name)}<br><span class="muted">${[...l.mats].map(esc).join(', ')}</span></td>
          <td class="n">${thresholds ? thresholds[i] ?? '<span class="bad">?</span>' : '—'}</td><td class="n">${l.tris.toLocaleString()}</td><td class="n">${l.verts.toLocaleString()}</td></tr>`).join('')}
        </table>`;
      if (!thresholds) h += `<p class="warn">No extras.ESRI_lod on the LOD node. ArcGIS will show only level 0. Run <code>add-esri-lod.py</code>.</p>`;
      else if (thresholds.length !== levels.length) h += `<p class="bad">ESRI_lod has ${thresholds.length} thresholds for ${levels.length} levels.</p>`;
      else if (thresholds.some((t, i) => i && t >= thresholds[i - 1])) h += `<p class="bad">Thresholds are not strictly descending.</p>`;
      else h += `<p class="ok">ESRI_lod matches the chain (${thresholds.join(', ')}).</p>`;
      h += `<p class="muted">three.js and Babylon.js ignore MSFT_lod, so the viewer loads every level and picks one: the first whose threshold the projected bounding-sphere radius reaches; below the last threshold nothing is drawn. ArcGIS JS gets the original file and switches by itself; its HUD level is the viewer's prediction for comparison.</p>`;
      return h;
    },
    materials() {
      return `<table><tr><th>#</th><th>Name</th><th>Alpha</th><th>Tex</th></tr>${(json.materials || []).map((m, i) => {
        const am = m.alphaMode || 'OPAQUE', pb = m.pbrMetallicRoughness || {};
        const tex = [['B', pb.baseColorTexture], ['MR', pb.metallicRoughnessTexture], ['N', m.normalTexture], ['O', m.occlusionTexture], ['E', m.emissiveTexture]]
          .filter(([, t]) => t).map(([k, t]) => k + (t.texCoord ? '/uv' + t.texCoord : '')).join(' ');
        return `<tr><td>${i}</td><td>${esc(m.name)}${m.doubleSided ? ' <span class="tag">2-sided</span>' : ''}</td>
          <td class="${am === 'BLEND' ? 'warn' : ''}">${am}${am === 'MASK' ? ' @' + (m.alphaCutoff ?? 0.5) : ''}</td><td>${tex}</td></tr>`;
      }).join('')}</table>`;
    },
    meshes() {
      return (json.meshes || []).map((m, mi) => `<h3>Mesh ${mi} ${esc(m.name || '')}</h3><table>
        <tr><th>Material</th><th class="n">Verts</th><th>Attributes</th></tr>
        ${m.primitives.map(p => `<tr><td>${esc(json.materials?.[p.material]?.name ?? '—')}</td>
          <td class="n">${(json.accessors[p.attributes.POSITION]?.count ?? 0).toLocaleString()}</td>
          <td>${Object.keys(p.attributes).sort().join(', ')}${p.extensions ? ' <span class="tag">' + Object.keys(p.extensions).join(', ') + '</span>' : ''}</td></tr>`).join('')}
        </table>`).join('');
    },
    json() {
      const s = JSON.stringify(info.json, null, 1);
      return `<pre>${esc(s.length > 200000 ? s.slice(0, 200000) + '\n… (truncated)' : s)}</pre>`;
    },
  };
  el.innerHTML = T[tab]();
  const pk = $('#pack'); if (pk) pk.onclick = packCurrent;
}

async function packCurrent() {
  try {
    const { json, bin } = await packParts(current.info.json);
    const name = current.name.replace(/\.gltf$/i, '') + '.glb';
    const file = new File([writeGlb(json, bin)], name, { type: 'model/gltf-binary' });
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(file), download: name });
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    addFiles([file]); tab = 'structure'; await open(name);
  } catch (e) { showErr('Pack failed: ' + e.message); }
}

useEngine('three');
</script>
</body>
</html>
